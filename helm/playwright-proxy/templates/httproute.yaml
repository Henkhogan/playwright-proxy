{{- if .Values.httproute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "playwright-proxy.fullname" . }}
  labels:
    {{- include "playwright-proxy.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.httproute.websocket.enabled }}
    # WebSocket support - Gateway API handles HTTP/1.1 Upgrade automatically
    gateway.networking.k8s.io/websocket: "enabled"
    {{- end }}
    {{- with .Values.httproute.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gatewayName }}
      namespace: {{ .Values.httproute.gatewayNamespace }}
      {{- if .Values.httproute.sectionName }}
      sectionName: {{ .Values.httproute.sectionName }}
      {{- end }}
  {{- with .Values.httproute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if .Values.httproute.websocket.enabled }}
      # Enable WebSocket support for all paths
      # Gateway API HTTPRoute automatically supports HTTP/1.1 Upgrade
      {{- end }}
      backendRefs:
        - name: {{ include "playwright-proxy.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 100
{{- end }}
