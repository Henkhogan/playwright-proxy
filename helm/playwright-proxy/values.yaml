# Default values for playwright-proxy
# This is a YAML-formatted file.
# Declare variables to be passed into templates.

replicaCount: 1

image:
  registry: ghcr.io
  repository: henkhogan/playwright-proxy
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: false
  fsGroup: 0

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: true

service:
  type: ClusterIP
  port: 3128
  targetPort: 3128
  annotations: {}

# Standard Kubernetes Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # Example annotations for Traefik (k3s default):
    # traefik.ingress.kubernetes.io/router.middlewares: default-compress@kubernetescrd
    # For nginx ingress controller, use:
    # nginx.ingress.kubernetes.io/websocket-services: playwright-proxy
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: playwright-proxy.lan
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: playwright-proxy-tls
  #    hosts:
  #      - playwright-proxy.lan
  
  # WebSocket-specific configuration
  websocket:
    enabled: true
    # Additional annotations for WebSocket support
    annotations:
      # Traefik (k3s default)
      traefik.ingress.kubernetes.io/router.middlewares: ""
      # Nginx (set the service name to match your release name)
      nginx.ingress.kubernetes.io/websocket-services: "playwright-proxy"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# Gateway API HTTPRoute configuration (alternative to standard Ingress)
httproute:
  enabled: false
  gatewayName: traefik
  gatewayNamespace: traefik
  sectionName: ""
  annotations: {}
    # Example annotations for Gateway API with Traefik:
    # traefik.io/router.middlewares: default-compress@kubernetescrd
  hostnames:
    - playwright-proxy.lan
  
  # WebSocket-specific configuration for Gateway API
  websocket:
    enabled: true
    # WebSocket support is built into Gateway API HTTPRoute
    # No special configuration needed - HTTP/1.1 Upgrade is handled automatically
    # Optional: Add timeout configurations via gateway policies if needed

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector:
  topology/location: home

tolerations: []

affinity: {}

# Environment variables (list format)
env:
  - name: PROXY_PORT
    value: "3128"

# Additional volumes (e.g., for custom CA bundle)
volumes: []
# Example for custom CA:
#  - name: custom-ca-bundle
#    configMap:
#      name: custom-ca-bundle
#      items:
#        - key: custom-ca-bundle.crt
#          path: custom-ca-bundle.crt

# Additional volume mounts
volumeMounts: []
# Example for custom CA:
#  - name: custom-ca-bundle
#    mountPath: /etc/ssl/certs/custom-ca-bundle.crt
#    subPath: custom-ca-bundle.crt

# Liveliness and readiness probes
livenessProbe:
  enabled: true
  httpGet:
    path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
