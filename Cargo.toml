[package]
name = "playwright-proxy"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.53", features = ["full"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
playwright = "0.0" # Community-maintained native Rust bindings
tracing = "0.1"
tracing-subscriber = "0.3"
rcgen = "0.14"
x509-parser = "0.18"
rustls = "0.23"
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
lazy_static = "1.5"
tokio-tungstenite = "0.30"
futures = "0.3"
